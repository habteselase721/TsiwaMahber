name: tsiwa_mahber
description: "ጽዋ ማህበር አስተዳደር - Ethiopian Orthodox Tsiwa Mahber Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  http: ^1.4.0
  intl: ^0.20.2
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^9.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  fl_chart: ^0.70.0
  google_sign_in: ^6.2.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#0F0F10"
  adaptive_icon_foreground: "assets/app_icon.jpg"

flutter:
  uses-material-design: true
